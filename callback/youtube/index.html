<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>OmniDark · conectando</title>
<style>
  :root { --bg:#f6f5fb; --card:#fff; --fg:#1c1a2b; --muted:#5d5a73; --line:#dddaea; --accent:#6b2fe0; --ok:#0f9a5b; --bad:#c62f3f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0d16; --card:#16141f; --fg:#ebe9f5; --muted:#a29fb8; --line:#2b2839; --accent:#a77bff; --ok:#2fd88c; --bad:#ff6b7a; color-scheme: dark; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui,"Segoe UI",sans-serif; padding:40px 16px; }
  main { max-width:560px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { margin:8px 0; color:var(--muted); }
  .btn { display:inline-block; background:var(--accent); color:#fff; padding:10px 16px; border-radius:10px; text-decoration:none; font-weight:600; border:0; cursor:pointer; font-size:15px; }
  textarea { width:100%; box-sizing:border-box; min-height:90px; font:13px ui-monospace,Consolas,monospace; border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--bg); color:var(--fg); }
  .err { color:var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1 id="t">Conectando ao OmniDark…</h1>
  <p id="m">Levando o login de volta para o painel no seu computador (http://127.0.0.1:8080).</p>
  <div class="row"><a class="btn" id="go" href="#">Abrir o OmniDark</a></div>
  <div id="manual" hidden>
    <p>Se o painel não abriu, copie o endereço abaixo e cole em <b>OmniDark → Contas → Retorno do login</b>:</p>
    <textarea id="url" readonly></textarea>
    <div class="row"><button class="btn" id="copy" type="button">Copiar</button></div>
  </div>
</main>
<script>
(function () {
  var q = location.search;
  var p = new URLSearchParams(q);
  var platform = (location.pathname.match(/callback\/(\w+)/) || [])[1] || 'tiktok';
  // 127.0.0.1 em vez de localhost: o Chrome não força https em endereço IP (em localhost às vezes força)
  var target = 'http://127.0.0.1:8080/oauth/' + platform + '/callback' + q;
  document.getElementById('go').href = target;
  document.getElementById('url').value = location.href;
  document.getElementById('copy').onclick = function () {
    var t = document.getElementById('url');
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).catch(function () { t.select(); document.execCommand('copy'); });
    this.textContent = 'Copiado';
  };
  if (p.get('error')) {
    document.getElementById('t').textContent = 'Login não concluído';
    document.getElementById('m').className = 'err';
    document.getElementById('m').textContent = (p.get('error_description') || p.get('error')) + '. Volte ao OmniDark e clique em Conectar de novo.';
    document.getElementById('go').href = 'http://127.0.0.1:8080/contas';
    return;
  }
  if (!p.get('code')) {
    document.getElementById('t').textContent = 'Página de retorno do OmniDark';
    document.getElementById('m').textContent = 'Esta página só é usada no fim do login do TikTok.';
    document.getElementById('go').hidden = true;
    return;
  }
  document.getElementById('manual').hidden = false;
  setTimeout(function () { location.replace(target); }, 600);
})();
</script>
</body>
</html>
